# NL WAN gateway — transparent TCP forward to RU VDS.
# nginx stream module: no TLS termination, no payload inspection.
# Clients connect to NL_IP:8443 → forwarded as-is to RU_VDS_IP:8443.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# Raise the file-descriptor limit to handle many concurrent TCP tunnels.
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

stream {
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr"';

    access_log /var/log/nginx/stream_access.log proxy;

    # ── upstream: the RU VDS running mtprotoproxy ──────────────────────────
    upstream mtproto_ru {
        server RU_VDS_IP:8443;   # ← replace with actual RU VDS IP

        # keepalive idle connections to amortise reconnect overhead.
        # Effective only with nginx Plus; on OSS this entry is silently ignored.
        # keepalive 64;
    }

    server {
        listen 8443;
        listen [::]:8443;

        proxy_pass    mtproto_ru;
        proxy_timeout 3600s;     # one hour max idle; matches CLIENT_KEEPALIVE on the proxy
        proxy_connect_timeout 5s;

        # Forward the real client IP using PROXY protocol v2 so mtprotoproxy
        # can log it correctly.  Enable PROXY_PROTOCOL = True in config.py on
        # the RU side when this is active.
        # proxy_protocol on;
    }
}
