version: '2.4'
services:
  nginx-gateway:
    image: nginx:1.27-alpine
    restart: always
    network_mode: "host"
    volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
        - /etc/localtime:/etc/localtime:ro
    logging:
        driver: "json-file"
        options:
            max-file: "5"
            max-size: "5m"
    mem_limit: 64m
    healthcheck:
        test: ["CMD-SHELL", "nginx -t && kill -0 $(cat /var/run/nginx.pid) 2>/dev/null"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 5s
