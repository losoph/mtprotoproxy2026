services:
  mtprotoproxy:
    build: .
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - MTPROTO_PORT=8443
    volumes:
        - ./config.py:/home/tgproxy/config.py
        - ./mtprotoproxy.py:/home/tgproxy/mtprotoproxy.py
        - /etc/localtime:/etc/localtime:ro
        # Email alerting (Feature 1): mount your msmtp config read-only so the
        # container can send mail. Create ./msmtprc with your Gmail app password
        # (see DEPLOY.md) and uncomment the line below. chmod 600 ./msmtprc.
        # - ./msmtprc:/home/tgproxy/.msmtprc:ro
    logging:
        driver: "json-file"
        options:
            max-file: "10"
            max-size: "10m"
#mem_limit: 768m
