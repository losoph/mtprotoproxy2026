### Telemt annotated reference config (upstream defaults + comments).
### Pulled from a live telemt install for documentation only — setup-telemt-node.sh
### generates the actual config.toml from env vars (DOMAIN/PORT/USERNAME), it does
### not read this file. Keep this in sync when telemt adds new options worth knowing
### about; see https://github.com/telemt/telemt for the authoritative version.

# === General Settings ===
[general]
use_middle_proxy = true
# Global ad_tag fallback when user has no per-user tag in [access.user_ad_tags]
# ad_tag = "00000000000000000000000000000000"
# Per-user ad_tag in [access.user_ad_tags] (32 hex from @MTProxybot)

# === Log Level ===
# Log level: debug | verbose | normal | silent
# Can be overridden with --silent or --log-level CLI flags
# RUST_LOG env var takes absolute priority over all of these
log_level = "normal"

[general.modes]
classic = false
secure = false
tls = true

[general.links]
show = "*"
# show = ["alice", "bob"] # Only show links for alice and bob
# show = "*"              # Show links for all users
# public_host = "proxy.example.com"  # Host (IP or domain) for tg:// links
# public_port = 443                  # Port for tg:// links (default: server.port)

# === Server Binding ===
[server]
port = 443
# proxy_protocol = false           # Enable if behind HAProxy/nginx with PROXY protocol
# metrics_port = 9090
# metrics_listen = "127.0.0.1:9090" # Listen address for metrics (overrides metrics_port)
# metrics_whitelist = ["127.0.0.1/32", "::1/128"]

# client_mss / client_mss_bulk (added upstream mid-2026, PR telemt/telemt#847,
# not yet in the dump this file was pulled from): fragments only the FakeTLS
# ServerHello to a low MSS, then restores a normal MSS for the rest of the
# connection — evades Russian mobile-carrier (TSPU) ServerHello-size drops
# without the packet-rate cost of clamping the whole connection. setup-telemt-node.sh
# sets these by default (CLIENT_MSS=tspu, CLIENT_MSS_BULK=1400); see
# https://github.com/telemt/telemt/blob/main/docs/Config_params/CONFIG_PARAMS.en.md#client_mss
# client_mss = "tspu"
# client_mss_bulk = "1400"

[server.api]
enabled = true
listen = "127.0.0.1:9091"
whitelist = ["127.0.0.1/32", "::1/128"]
minimal_runtime_enabled = false
minimal_runtime_cache_ttl_ms = 1000

# Listen on multiple interfaces/IPs - IPv4
[[server.listeners]]
ip = "0.0.0.0"

# === Anti-Censorship & Masking ===
[censorship]
# Fake-TLS / SNI masking domain used in generated ee-links.
# Changing tls_domain invalidates previously generated TLS links.
tls_domain = "petrovich.ru"

mask = true
tls_emulation = true         # Fetch real cert lengths and emulate TLS records
tls_front_dir = "tlsfront"   # Cache directory for TLS emulation

[access.users]
# format: "username" = "32_hex_chars_secret"
hello = "00000000000000000000000000000000"
